.panel .ad{color:var(--navy);font-weight:700;font-size:19px;padding:10px 6px}

.qr svg{width:100%;height:100%;display:block}
.rider b{display:block;font-family:'Inter';font-weight:800;color:var(--navy);font-size:19px;line-height:1.2;margin-top:8px}

.toast b{display:block;font-family:'Inter';font-weight:800;font-size:28px;color:var(--navy)}
.toast span{font-size:20px;color:var(--ink2)}
